<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MagnetEngine Icon Generator</title>
  <style>
    body { background: #030A06; color: white; font-family: system-ui; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 24px; }
    h2 { color: #10B981; margin: 0; }
    .row { display: flex; gap: 24px; align-items: flex-end; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #71717a; }
    canvas { border-radius: 16px; border: 1px solid rgba(16,185,129,0.3); }
    button {
      padding: 12px 32px; background: #10B981; color: #022c22;
      font-size: 14px; font-weight: 700; border: none; border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #34D399; }
    p { color: #52525b; font-size: 13px; text-align: center; max-width: 420px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>🧲 MagnetEngine Icon Generator</h2>
  <p>Click <strong style="color:#10B981">Generate & Download All</strong> — it will save icon16.png, icon48.png, icon128.png to your Downloads folder. Then move them into the <code style="color:#10B981">extension/</code> folder and reload the extension.</p>

  <div class="row">
    <div class="item"><canvas id="c16"  width="16"  height="16"></canvas>16×16</div>
    <div class="item"><canvas id="c32"  width="32"  height="32"></canvas>32×32</div>
    <div class="item"><canvas id="c48"  width="48"  height="48"></canvas>48×48</div>
    <div class="item"><canvas id="c128" width="128" height="128"></canvas>128×128</div>
  </div>

  <button onclick="downloadAll()">Generate & Download All</button>

<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background
  const bg = ctx.createRadialGradient(s*.5, s*.55, 0, s*.5, s*.5, s*.7);
  bg.addColorStop(0,   '#0D2818');
  bg.addColorStop(1,   '#030A06');
  ctx.fillStyle = bg;
  const r = s * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Glow
  const glow = ctx.createRadialGradient(s*.5, s*.6, 0, s*.5, s*.6, s*.5);
  glow.addColorStop(0, 'rgba(16,185,129,0.35)');
  glow.addColorStop(1, 'rgba(16,185,129,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, s, s);

  // "M" letter
  ctx.save();
  const fs = s * 0.52;
  ctx.font = `900 ${fs}px -apple-system, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Subtle shadow
  ctx.shadowColor = 'rgba(16,185,129,0.6)';
  ctx.shadowBlur  = s * 0.12;

  const grad = ctx.createLinearGradient(s*.2, s*.3, s*.8, s*.75);
  grad.addColorStop(0, '#34D399');
  grad.addColorStop(1, '#059669');
  ctx.fillStyle = grad;
  ctx.fillText('M', s * 0.5, s * 0.52);
  ctx.restore();

  // Bottom shine
  const shine = ctx.createLinearGradient(0, s*.85, 0, s);
  shine.addColorStop(0, 'rgba(16,185,129,0.15)');
  shine.addColorStop(1, 'rgba(16,185,129,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(0, s*.85, s, s*.15);
}

['c16','c32','c48','c128'].forEach(id => drawIcon(document.getElementById(id)));

function downloadAll() {
  const files = [
    { id: 'c16',  name: 'icon16.png'  },
    { id: 'c32',  name: 'icon32.png'  },
    { id: 'c48',  name: 'icon48.png'  },
    { id: 'c128', name: 'icon128.png' },
  ];
  files.forEach(({ id, name }) => {
    const a = document.createElement('a');
    a.download = name;
    a.href = document.getElementById(id).toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
