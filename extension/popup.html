<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* The popup is the dashboard's palette, carried by hand: an extension page
       cannot use the app's Tailwind build, so the tokens are restated once
       here. Every value mirrors docs/DESIGN-TOKENS.md — near-black grounds,
       white for the one action, true grays for chrome, green only for a good
       outcome and red only for a destructive one. No orange: the product's
       signed-in side has none. */
    :root {
      --surface: #08080a;          /* surface */
      --raised: #101014;           /* surface-raised */
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --text: #ffffff;
      --text-2: #d4d4d4;           /* neutral-300 */
      --text-3: #a3a3a3;           /* neutral-400 — the floor for text here */
      --positive: #34d399;         /* positive-400 */
      --positive-wash: rgba(16,185,129,0.12);
      --positive-line: rgba(16,185,129,0.28);
      --danger: #f87171;           /* danger-400 */
      --danger-wash: rgba(239,68,68,0.08);
      --danger-line: rgba(239,68,68,0.22);
    }

    /* The product's two faces, bundled (fonts/, OFL). Latin only: the popup
       shows numbers, handles and a few labels. */
    @font-face {
      font-family: 'Schibsted Grotesk';
      font-weight: 400 900;
      font-display: swap;
      src: url('fonts/schibsted-grotesk-latin-wght-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Sometype Mono';
      font-weight: 400 700;
      font-display: swap;
      src: url('fonts/sometype-mono-latin-wght-normal.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: var(--surface);
      color: var(--text);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(255,255,255,0.2); color: #fff; }
    .num { font-family: 'Sometype Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    /* ── Header ── */
    .header {
      padding: 14px 16px 13px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* The dashboard's mark (src/components/Logo.tsx): a white disc holding
       Lucide's `magnet` glyph rotated 90° in the ground colour. */
    .logo { display: flex; align-items: center; gap: 9px; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 9999px; background: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 0 15px -3px rgba(255,255,255,0.2);
    }
    .logo-mark svg { width: 15.4px; height: 15.4px; }
    .logo-word { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }

    /* ── Status badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 9999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      border: 1px solid var(--line);
    }
    .badge-idle    { color: var(--text-3); }
    .badge-running { color: #fff; border-color: var(--line-strong); background: rgba(255,255,255,0.04); }
    .badge-paused  { color: var(--text-3); }
    .badge-done    { color: var(--positive); border-color: var(--positive-line); background: var(--positive-wash); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    .dot-pulse { animation: pulse 1.4s ease-in-out infinite; }

    /* ── Body ── */
    .body { padding: 14px 16px 16px; }

    .empty {
      text-align: center; padding: 22px 8px 12px;
      color: var(--text-3); font-size: 13px; line-height: 1.6;
    }
    .empty strong { display: block; color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 4px; }

    /* ── Cards: the dashboard's raised panel and hairline ── */
    .card {
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.04);
    }
    .label { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; }

    .progress { padding: 13px 14px 14px; margin-bottom: 8px; }
    .progress-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .big-num { font-size: 24px; font-weight: 600; color: #fff; line-height: 1; letter-spacing: -0.02em; }
    .big-num .of { font-size: 14px; color: var(--text-3); font-weight: 400; }
    .bar-bg { height: 4px; background: rgba(255,255,255,0.08); border-radius: 9999px; overflow: hidden; }
    /* Sends are white, as in the dashboard's chart. */
    /* Filled by scaling, not by width: a width transition relays the popup out
       every frame; a transform only repaints the bar. */
    .bar-fill { height: 100%; width: 100%; background: #fff; transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(0.16,1,0.3,1); }

    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .stat { padding: 11px 8px 9px; text-align: center; }
    .stat-val { font-size: 17px; font-weight: 600; color: #fff; line-height: 1; }
    .stat-lbl { margin-top: 6px; }

    .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; margin-bottom: 8px; }
    .cd-time { font-size: 17px; font-weight: 600; color: #fff; }

    .active-lead { display: none; }
    .active-lead.show { display: flex; }
    .al-handle { font-size: 13px; color: #fff; margin-top: 4px; }
    .al-spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Controls: the dashboard's buttons ── */
    .controls { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1; height: 38px; border: 1px solid transparent; border-radius: 12px;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background-color .2s, border-color .2s, color .2s, transform .1s;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid #e5e5e5; outline-offset: 2px; }
    .btn-start { background: #fff; color: var(--surface); }
    .btn-start:hover:not(:disabled) { background: #e5e5e5; }
    .btn-pause { background: transparent; color: #fff; border-color: var(--line-strong); }
    .btn-pause:hover:not(:disabled) { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); }
    .btn-stop { background: var(--danger-wash); color: var(--danger); border-color: var(--danger-line); }
    .btn-stop:hover:not(:disabled) { background: rgba(239,68,68,0.16); }

    .footer { text-align: center; margin-top: 12px; font-size: 11px; color: var(--text-3); }

    @media (prefers-reduced-motion: reduce) {
      .dot-pulse, .al-spinner { animation: none; }
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#08080a" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g transform="rotate(90 12 12)">
            <path d="m12 15 4 4"/>
            <path d="M2.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.029-6.029a1 1 0 1 1 3 3l-6.029 6.029a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.365-6.367A1 1 0 0 0 8.716 4.282z"/>
            <path d="m5 8 4 4"/>
          </g>
        </svg>
      </span>
      <span class="logo-word">MagnetEngine</span>
    </div>
    <div id="badge" class="badge badge-idle" role="status">
      <div id="dot" class="dot"></div>
      <span id="badgeText">Idle</span>
    </div>
  </div>

  <div class="body">
    <div id="empty" class="empty">
      <strong>No campaign loaded</strong>
      Approve DMs in your dashboard's queue and send them here.
    </div>

    <div id="view" style="display:none">
      <!-- Progress -->
      <div class="card progress">
        <div class="progress-row">
          <div class="label">Campaign progress</div>
          <div class="big-num num">
            <span id="sentNum">0</span><span class="of"> / <span id="totalNum">0</span></span>
          </div>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="card stat">
          <div class="stat-val num" id="statToday">0</div>
          <div class="label stat-lbl">Today</div>
        </div>
        <div class="card stat">
          <div class="stat-val num" id="statLeft">0</div>
          <div class="label stat-lbl">Left</div>
        </div>
        <div class="card stat">
          <div class="stat-val num" id="statFailed">0</div>
          <div class="label stat-lbl">Failed</div>
        </div>
      </div>

      <!-- Countdown -->
      <div class="card row">
        <div class="label">Next DM in</div>
        <div class="cd-time num" id="countdown">—</div>
      </div>

      <!-- Active lead -->
      <div class="card row active-lead" id="activeLead">
        <div>
          <div class="label">Sending to</div>
          <div class="al-handle num" id="activeHandle">@—</div>
        </div>
        <div class="al-spinner" aria-hidden="true"></div>
      </div>

      <!-- Controls. Lucide's play, pause and trash-2, drawn inline. -->
      <div class="controls">
        <button class="btn btn-start" id="btnStart">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
          Resume
        </button>
        <button class="btn btn-pause" id="btnPause">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
          Pause
        </button>
        <button class="btn btn-stop" id="btnStop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>

      <div class="footer num" id="modeLabel">Delay: 3–8 min</div>
    </div>
  </div>

  <script src="protocol.js"></script>
  <script src="popup.js"></script>
</body>
</html>
