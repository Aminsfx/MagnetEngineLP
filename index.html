    <link rel="stylesheet" href="/index.css">
    <!-- Cal element-click embed. The stub is inert; embed.js (~100 KB) is only
         fetched once the browser is idle on the landing page, or the moment a
         pointer or keyboard focus reaches a booking button anywhere else. It
         used to load at parse time on every route, dashboard included. -->
    <script type="text/javascript">
        (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
        (function () {
            var started = false;
            function startCal() {
                if (started) return;
                started = true;
                Cal("init", "15min", { origin: "https://app.cal.com" });
                Cal.ns["15min"]("ui", { "hideEventTypeDetails": false, "layout": "month_view" });
            }
            function onIntent(e) {
                if (e.target && e.target.closest && e.target.closest("[data-cal-link]")) startCal();
            }
            document.addEventListener("pointerover", onIntent, { passive: true });
            document.addEventListener("focusin", onIntent);
            document.addEventListener("touchstart", onIntent, { passive: true });
            if (location.pathname === "/") {
                window.addEventListener("load", function () {
                    (window.requestIdleCallback || function (f) { setTimeout(f, 1200); })(startCal, { timeout: 4000 });
                });
            }
        })();
    </script>
