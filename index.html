<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Search: the live page (/) targets "AI appointment setter". Every route
         is this one file, so the canonical is written per path below; B and C
         add their own noindex (LandingShell). -->
    <title>AI Appointment Setter for Instagram | MagnetEngine</title>
    <meta name="description"
        content="MagnetEngine is an AI appointment setter for Instagram. It finds your ideal clients, writes each one a personal DM, sends the ones you approve and drafts the replies that book the call.">
    <script>
        (function () {
            var link = document.createElement('link');
            link.rel = 'canonical';
            link.href = 'https://magnetengine.xyz' + (location.pathname === '/' ? '/' : location.pathname.replace(/\/$/, ''));
            document.head.appendChild(link);
        })();
    </script>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MagnetEngine">
    <meta property="og:url" content="https://magnetengine.xyz/">
    <meta property="og:title" content="MagnetEngine — the AI appointment setter for Instagram">
    <meta property="og:description"
        content="Finds your ideal clients on Instagram, writes each one a personal DM, sends the ones you approve and drafts the replies that book the call.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="MagnetEngine — the AI appointment setter for Instagram">
    <meta name="twitter:description"
        content="Finds your ideal clients on Instagram, writes each one a personal DM, sends the ones you approve and drafts the replies that book the call.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MagnetEngine",
        "alternateName": "MagnetEngine AI Appointment Setter",
        "url": "https://magnetengine.xyz/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Chrome",
        "description": "An AI appointment setter for Instagram: finds ideal clients, writes a personal DM for each, sends the approved ones from your own account and drafts the replies that book sales calls."
    }
    </script>
    <!-- Self-hosted type (see the @font-face rules in index.css). The Latin
         cut of the text face is the one file every page needs before it can
         paint its headline, so it is fetched alongside the HTML rather than
         discovered after the stylesheet parses. -->
    <link rel="preload" href="/src/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font"
        type="font/woff2" crossorigin>

    <link rel="stylesheet" href="/index.css">
    <!-- Cal element-click embed. The stub is inert; embed.js (~100 KB) is only
         fetched once the browser is idle on a landing page (/ and /lp/*), or
         the moment a pointer or keyboard focus reaches a booking button
         anywhere else. It used to load at parse time on every route, dashboard
         included. A click that lands before embed.js has run (a phone's tap
         comes right on the heels of its touchstart) is not lost: it queues the
         modal itself, which embed.js opens as soon as it loads. -->
    <script type="text/javascript">
        (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
        (function () {
            var started = false;
            function startCal() {
                if (started) return;
                started = true;
                Cal("init", "15min", { origin: "https://app.cal.com" });
                Cal.ns["15min"]("ui", { "hideEventTypeDetails": false, "layout": "month_view" });
            }
            function onIntent(e) {
                if (e.target && e.target.closest && e.target.closest("[data-cal-link]")) startCal();
            }
            function onClick(e) {
                var el = e.target && e.target.closest && e.target.closest("[data-cal-link]");
                // Once embed.js has run (it defines cal-modal-box) it answers the click itself.
                if (!el || (window.customElements && customElements.get("cal-modal-box"))) return;
                startCal();
                var config = {};
                try { config = JSON.parse(el.getAttribute("data-cal-config") || "{}"); } catch (_) { }
                Cal.ns["15min"]("modal", { calLink: el.getAttribute("data-cal-link"), config: config });
            }
            document.addEventListener("pointerover", onIntent, { passive: true });
            document.addEventListener("focusin", onIntent);
            document.addEventListener("touchstart", onIntent, { passive: true });
            document.addEventListener("click", onClick);
            if (location.pathname === "/" || location.pathname.indexOf("/lp/") === 0) {
                window.addEventListener("load", function () {
                    (window.requestIdleCallback || function (f) { setTimeout(f, 1200); })(startCal, { timeout: 4000 });
                });
            }
        })();
    </script>
</head>

<body class="bg-surface text-neutral-300 antialiased selection:bg-brand-500/30 selection:text-brand-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
