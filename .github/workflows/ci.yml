# Types, lint and the unit suite on every push and pull request.
#
# Until this existed nothing ran the 660 tests except whoever remembered to.
# The extension's real-browser tests (npm run test:e2e) are not here: they need
# a Chromium download and take minutes, so they stay a thing to run before an
# extension release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
