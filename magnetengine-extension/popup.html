<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: #030A06;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Header ── */
    .header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* ── Logo ──
       The dashboard's mark (src/components/Logo.tsx): a white disc holding
       Lucide's `magnet` glyph rotated 90° in near-black, beside an all-white
       wordmark. Same glyph, same colours, same 0.55 glyph-to-disc ratio. */
    .logo { display: flex; align-items: center; gap: 9px; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 9999px; background: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 0 15px -3px rgba(255,255,255,0.2);
    }
    .logo-mark svg { width: 15.4px; height: 15.4px; }
    .logo-word { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .badge-idle    { background: rgba(255,255,255,0.05); color: #52525b; border: 1px solid rgba(255,255,255,0.08); }
    .badge-running { background: rgba(16,185,129,0.1);  color: #10B981; border: 1px solid rgba(16,185,129,0.2); }
    .badge-paused  { background: rgba(245,158,11,0.1);  color: #F59E0B; border: 1px solid rgba(245,158,11,0.2); }
    .badge-done    { background: rgba(99,102,241,0.1);  color: #818CF8; border: 1px solid rgba(99,102,241,0.2); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .dot-pulse { animation: pulse 1.4s infinite; }

    /* ── Body ── */
    .body { padding: 14px 18px; }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 24px 0 10px;
      color: #3f3f46; font-size: 12px; line-height: 1.7;
    }

    /* ── Progress card ── */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 13px 15px;
      margin-bottom: 10px;
    }
    .card-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
    .card-label { font-size: 10px; color: #52525b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; }
    .big-num { font-size: 24px; font-weight: 700; color: white; line-height: 1; }
    .big-num .of { font-size: 14px; color: #52525b; font-weight: 400; }
    .bar-bg { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg,#10B981,#06B6D4); border-radius: 2px; transition: width .5s ease; }

    /* ── Stats row ── */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px 8px 8px; text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 700; color: white; line-height: 1; }
    .stat-lbl { font-size: 9px; color: #52525b; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }

    /* ── Countdown ── */
    .countdown {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .cd-label { font-size: 10px; color: #52525b; text-transform: uppercase; letter-spacing: 0.12em; }
    .cd-time { font-size: 17px; font-weight: 700; font-family: monospace; color: #10B981; }

    /* ── Active lead ── */
    .active-lead {
      background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15);
      border-radius: 10px; padding: 9px 14px;
      display: none; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .active-lead.show { display: flex; }
    .al-label { font-size: 9px; color: #52525b; text-transform: uppercase; letter-spacing: 0.1em; }
    .al-handle { font-size: 13px; font-weight: 600; color: #10B981; margin-top: 2px; }
    .al-spinner {
      width: 14px; height: 14px; border: 2px solid rgba(16,185,129,0.2);
      border-top-color: #10B981; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Controls ── */
    .controls { display: flex; gap: 7px; }
    .btn {
      flex: 1; padding: 10px 6px; border: none; border-radius: 10px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-start  { background: #10B981; color: #022c22; }
    .btn-start:hover:not(:disabled) { background: #34D399; }
    .btn-pause  { background: rgba(245,158,11,.12); color: #F59E0B; border: 1px solid rgba(245,158,11,.2); }
    .btn-pause:hover:not(:disabled)  { background: rgba(245,158,11,.22); }
    .btn-stop   { background: rgba(239,68,68,.08); color: #F87171; border: 1px solid rgba(239,68,68,.12); }
    .btn-stop:hover:not(:disabled)   { background: rgba(239,68,68,.18); }

    .footer { text-align: center; margin-top: 10px; font-size: 10px; color: #3f3f46; }
    .footer span { color: #10B981; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#030604" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g transform="rotate(90 12 12)">
            <path d="m12 15 4 4"/>
            <path d="M2.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.029-6.029a1 1 0 1 1 3 3l-6.029 6.029a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.365-6.367A1 1 0 0 0 8.716 4.282z"/>
            <path d="m5 8 4 4"/>
          </g>
        </svg>
      </span>
      <span class="logo-word">MagnetEngine</span>
    </div>
    <div id="badge" class="badge badge-idle">
      <div id="dot" class="dot"></div>
      <span id="badgeText">Idle</span>
    </div>
  </div>

  <div class="body">
    <div id="empty" class="empty">
      No campaign loaded.<br>Send approved DMs from the dashboard.
    </div>

    <div id="view" style="display:none">
      <!-- Progress -->
      <div class="card">
        <div class="card-row">
          <div class="card-label">Campaign progress</div>
          <div class="big-num">
            <span id="sentNum">0</span>
            <span class="of"> / <span id="totalNum">0</span></span>
          </div>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <div class="stat-val" id="statToday">0</div>
          <div class="stat-lbl">Today</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="statLeft">0</div>
          <div class="stat-lbl">Left</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="statFailed">0</div>
          <div class="stat-lbl">Failed</div>
        </div>
      </div>

      <!-- Countdown -->
      <div class="countdown">
        <div class="cd-label">Next DM in</div>
        <div class="cd-time" id="countdown">—</div>
      </div>

      <!-- Active lead -->
      <div class="active-lead" id="activeLead">
        <div>
          <div class="al-label">Sending to</div>
          <div class="al-handle" id="activeHandle">@—</div>
        </div>
        <div class="al-spinner"></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn btn-start" id="btnStart">▶ Resume</button>
        <button class="btn btn-pause" id="btnPause">⏸ Pause</button>
        <button class="btn btn-stop"  id="btnStop">✕ Clear</button>
      </div>

      <div class="footer"><span id="modeLabel">Delay: 3–8 min</span></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
